<!doctype html>
<html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Froggy Casino (DEMO)</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#061B35;--c:#00BFFF;--n:#087CFF;--card:#0c2a4d;--mut:#7f9bb8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(circle at 50% -10%,#0b3a72,var(--bg) 60%);color:#fff;font-family:system-ui,sans-serif;padding-bottom:78px;min-height:100vh}
.top{display:flex;align-items:center;gap:10px;padding:12px 14px;position:sticky;top:0;background:#061B35ee;backdrop-filter:blur(8px);z-index:5}
.top img,.av{width:38px;height:38px;border-radius:50%;border:2px solid var(--c);box-shadow:0 0 10px var(--c);object-fit:cover;background:var(--card)}
.logo{font-weight:800;color:var(--c);text-shadow:0 0 10px var(--c)}
.bal{margin-left:auto;background:var(--card);border:1px solid var(--n);border-radius:20px;padding:6px 12px;box-shadow:0 0 12px #087cff55}
main{padding:14px}.page{display:none;animation:in .3s}.page.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.card{background:linear-gradient(160deg,#10396a,var(--card));border:1px solid #087cff66;border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 6px 18px #0006,inset 0 0 18px #00bfff15;transition:transform .12s}
.card:active{transform:scale(.97)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button.b{background:linear-gradient(90deg,var(--n),var(--c));border:0;color:#fff;font-weight:700;padding:10px 14px;border-radius:12px;box-shadow:0 0 14px #00bfff88;transition:transform .1s;width:100%}
button.b:active{transform:scale(.94)}button.b:disabled{opacity:.5}
.hero{display:flex;align-items:center;gap:10px;text-align:left}.frog{width:110px;flex:none;filter:drop-shadow(0 0 12px var(--c));animation:fl 3s infinite ease-in-out}
@keyframes fl{50%{transform:translateY(-6px)}}
.mut{color:var(--mut);font-size:12px}.tag{font-size:10px;background:#087cff;border-radius:6px;padding:1px 5px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#061B35f5;border-top:1px solid #087cff66;padding-bottom:env(safe-area-inset-bottom)}
nav div{flex:1;text-align:center;padding:10px 0;font-size:11px;color:var(--mut)}nav div span{display:block;font-size:20px}
nav .on{color:var(--c);text-shadow:0 0 10px var(--c)}
.big{font-size:44px;font-weight:800;text-align:center;color:var(--c);text-shadow:0 0 16px var(--c)}
#arena{position:relative;height:300px;background:#04142a;border-radius:14px;overflow:hidden;border:1px solid var(--n)}
.duck{position:absolute;font-size:34px;user-select:none}
.wheel{width:220px;height:220px;border-radius:50%;margin:10px auto;border:4px solid var(--c);box-shadow:0 0 20px var(--c);transition:transform 4s cubic-bezier(.1,.7,.1,1);position:relative}
.ptr{text-align:center;font-size:26px;margin-bottom:-14px;position:relative;z-index:2}
.chest{font-size:50px;text-align:center;filter:drop-shadow(0 0 10px var(--c))}
.row{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid #ffffff12;font-size:13px}
.pos{color:#4ade80}.neg{color:#f87171}
.chips{display:flex;gap:6px;margin-bottom:10px;overflow:auto}.chips button{background:var(--card);color:#fff;border:1px solid var(--n);border-radius:14px;padding:6px 12px}.chips .on{background:var(--n)}
#modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:20}
#modal .card{width:84%;text-align:center}
.pop{animation:pop .6s}@keyframes pop{0%{transform:scale(.2) rotate(-20deg)}70%{transform:scale(1.2)}}
.shake{animation:sh .5s infinite}@keyframes sh{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.m{color:var(--mut)}.mythic{color:#ff7be5}.legendary{color:#fbbf24}.epic{color:#c084fc}.rare{color:#60a5fa}
#roll{position:fixed;inset:0;background:#061B35f2;z-index:30;display:none;flex-direction:column;justify-content:center}.rs{overflow:hidden;position:relative;height:150px;width:100%;background:#04142a;border-block:1px solid var(--n)}.rl{position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1px;background:var(--c);box-shadow:0 0 14px var(--c);z-index:2}.rt{display:flex;height:100%;will-change:transform}.tl{flex:none;width:120px;margin:8px 8px 8px 0;border-radius:12px;background:var(--card);border:1px solid #087cff66;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;text-align:center;padding:4px}.tl.mythic{border-color:#ff7be5}.tl.legendary{border-color:#fbbf24}.tl.epic{border-color:#c084fc}.tl.rare{border-color:#60a5fa}
.pi{width:64px;height:64px;object-fit:contain}.cv{width:104px;height:104px;display:block;margin:6px auto;animation:fl 3s infinite ease-in-out}.ib{position:absolute;right:10px;top:6px;color:var(--mut);z-index:2;padding:4px}#cases .card{position:relative;overflow:hidden}.k-common{background:linear-gradient(160deg,#17406e,#0c2a4d)}.k-rare{background:linear-gradient(160deg,#0d4f9c,#0c2a4d);border-color:#60a5fa}.k-epic{background:linear-gradient(160deg,#4a2a8c,#0c2a4d);border-color:#c084fc}.k-legendary{background:linear-gradient(160deg,#7a5a10,#0c2a4d);border-color:#fbbf24}.k-mythic{background:linear-gradient(160deg,#7a1f78,#0a2a58);border-color:#ff7be5;box-shadow:0 0 22px #ff7be544}
#mbody{max-height:80vh;overflow:auto}
</style></head><body>
<div class="top"><img id="av" src="" alt=""><div><div class="logo">🐸 Froggy Casino</div><div class="mut" id="un"></div></div>
<div class="bal">⭐ <b id="bal">0</b></div><div class="bal" style="margin-left:0;padding:6px 10px" onclick="go('inv')">🎒</div></div>
<main>
<section class="page on" id="p-home">
 <div class="card hero"><svg class="frog" viewBox="0 0 120 120"><circle cx="60" cy="70" r="42" fill="#1b2a41" stroke="#00BFFF" stroke-width="3"/><circle cx="60" cy="52" r="30" fill="#3fbf5a"/><circle cx="44" cy="30" r="12" fill="#3fbf5a"/><circle cx="76" cy="30" r="12" fill="#3fbf5a"/><rect x="30" y="26" width="26" height="16" rx="7" fill="#061B35" stroke="#00BFFF" stroke-width="3"/><rect x="64" y="26" width="26" height="16" rx="7" fill="#061B35" stroke="#00BFFF" stroke-width="3"/><circle cx="43" cy="34" r="4" fill="#fff"/><circle cx="77" cy="34" r="4" fill="#fff"/><path d="M42 62q18 12 36 0" stroke="#145c26" stroke-width="3" fill="none"/><circle cx="60" cy="96" r="9" fill="#087CFF"/><path d="M55 96l9-4-3 9-2-3z" fill="#fff"/></svg>
 <div><h2 style="margin:0">Froggy</h2><div class="mut">Грай, відкривай кейси, збирай колекцію.</div><br><button class="b" onclick="topup()">+ Поповнити баланс</button></div></div>
 <div class="grid"><div class="card">👥 Онлайн <span class="tag">симуляція</span><div class="big" id="online" style="font-size:30px">0</div></div>
 <div class="card" onclick="go('games')">🎮 Популярні ігри<div class="mut">Miner · Crash · Duck · Spin</div></div></div>
 <div class="card"><b>Стрічка</b> <span class="tag">DEMO</span><div id="feed"></div></div>
</section>
<section class="page" id="p-games"><div class="grid">
 <div class="card" onclick="game('miner')"><div class="chest">⛏️</div><b>Miner</b><div class="mut">10 ⭐</div></div>
 <div class="card" onclick="game('crash')"><div class="chest">🚀</div><b>Crash</b><div class="mut">10 ⭐</div></div>
 <div class="card" onclick="game('duck')"><div class="chest">🦆</div><b>Duck Hunt</b><div class="mut">безкоштовно</div></div>
 <div class="card" onclick="game('spin')"><div class="chest">🎡</div><b>Lucky Spin</b><div class="mut">10 ⭐</div></div></div>
 <div id="game"></div></section>
<section class="page" id="p-cases"><div class="mut" style="margin-bottom:8px">Віртуальні колекційні предмети · не є блокчейн-NFT і не є подарунками Telegram</div><div class="grid" id="cases"></div></section>
<section class="page" id="p-history"><div class="chips" id="chips"></div><div id="hist"></div></section>
<section class="page" id="p-inv"></section>
<section class="page" id="p-profile"></section>
</main>
<nav id="nav"></nav>
<div id="roll"></div>
<div id="modal" onclick="this.style.display='none'"><div class="card" id="mbody"></div></div>
<script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();
const $=s=>document.querySelector(s);let ME;
const api=async(p,o={})=>{const r=await fetch('/api'+p,{method:o.body?'POST':(o.m||'GET'),headers:{'Content-Type':'application/json','X-Init-Data':tg?.initData||''},body:o.body?JSON.stringify(o.body):(o.m==='POST'?'{}':undefined)});const j=await r.json();if(!r.ok){toast(j.error);throw j}return j};
const toast=t=>tg?.showAlert?tg.showAlert(t):alert(t);
const setBal=b=>{$('#bal').textContent=b;ME.balance=b};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TABS=[['home','🏠','Головна'],['games','🎮','Ігри'],['cases','📦','Кейси'],['history','🕘','Історія'],['profile','👤','Профіль']];
$('#nav').innerHTML=TABS.map(t=>`<div id="n-${t[0]}" onclick="go('${t[0]}')"><span>${t[1]}</span>${t[2]}</div>`).join('');
function go(p){document.querySelectorAll('.page').forEach(e=>e.classList.remove('on'));$('#p-'+p).classList.add('on');
 document.querySelectorAll('nav div').forEach(e=>e.classList.remove('on'));$('#n-'+(p==='withdraw'?'profile':p))?.classList.add('on');
 if(p==='history')hist('all');if(p==='profile')profile();if(p==='inv')inv();if(p==='withdraw')withdraw()}
let CS=[];const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-');
const img=(n,c='pi')=>`<img src="/img/${n}.png" class="${c}" alt="">`;
const tImg=o=>o.t==='stars'?img('star'):img(slug(o.name));
const tTxt=o=>o.t==='stars'?`+${o.amount} ⭐`:esc(o.name);
const modal=h=>{$('#mbody').innerHTML=h;$('#modal').style.display='flex'};
const fmt=w=>w<0.01?w.toFixed(13).replace(/0+$/,''):+w.toFixed(2);
const rtp=c=>Math.round(c.outcomes.reduce((a,o)=>a+(o.t==='stars'?o.amount:o.price)*o.w,0)/c.price);
async function loadCases(){CS=await api('/cases');$('#cases').innerHTML=CS.map(c=>`<div class="card k-${c.rar[1]}"><span onclick="info('${c.id}')" class="ib">ⓘ</span>${img(c.cover,'cv')}<div style="text-align:center"><b>${esc(c.name)}</b></div><br><button class="b" onclick="openCase('${c.id}')">Відкрити · ${c.price} ⭐</button></div>`).join('')}
function info(id){const c=CS.find(x=>x.id===id);modal(`<h3>${esc(c.name)} · ${c.price} ⭐</h3>`+c.outcomes.map(o=>`<div class="row"><span>${tImg(o).replace('class="pi"','class="pi" style="width:28px;height:28px;vertical-align:middle"')} ${tTxt(o)}${o.t==='item'?` <span class="mut">(продаж ${o.price} ⭐)</span>`:''}</span><b>${fmt(o.w)}%</b></div>`).join('')+`<div class="mut" style="margin-top:8px">Середнє повернення (з продажем предметів): ≈${rtp(c)}%. Предмети віртуальні, не є блокчейн-NFT.</div>`)}
async function openCase(id){const c=CS.find(x=>x.id===id);let r;try{r=await api('/case/open',{body:{id}})}catch(e){return}
 setBal(r.balance);const W=128,N=46,T=38;
 const rp=()=>{let x=Math.random()*100;for(const o of c.outcomes){if((x-=o.w)<0)return o}return c.outcomes[0]};
 const tiles=Array.from({length:N},rp);tiles[T]=r.out;
 const o=$('#roll');o.style.display='flex';
 o.innerHTML=`<div class="rs"><div class="rl"></div><div class="rt" id="rt">${tiles.map(t=>`<div class="tl ${t.rarity||'rare'}">${tImg(t)}<div>${tTxt(t)}</div></div>`).join('')}</div></div><div id="rr" style="text-align:center;margin-top:24px;min-height:170px"></div>`;
 const rt=$('#rt');rt.style.transform='translateX(0)';rt.getBoundingClientRect();
 const off=-(T*W+60)+innerWidth/2+(Math.random()*60-30);
 rt.style.transition='transform 6s cubic-bezier(.12,.6,.1,1)';rt.style.transform=`translateX(${off}px)`;
 const x=r.out,close=`$('#roll').style.display='none'`;
 setTimeout(()=>{$('#rr').innerHTML=`<div class="pop">${tImg(x).replace('class="pi"','class="cv"')}<h2 class="${x.rarity||''}">${tTxt(x)}</h2></div>`+(x.t==='item'?`<div style="display:flex;gap:10px;padding:0 16px"><button class="b" onclick="sellItem(${r.id},${x.price})">Продати · ${x.price} ⭐</button><button class="b" onclick="${close}">В інвентар</button></div>`:`<button class="b" style="width:200px" onclick="${close}">Забрати</button>`)},6200)}
async function sellItem(id,price){try{const r=await api('/item/sell',{body:{id}});setBal(r.balance);$('#rr').innerHTML=`<h2 class="pos">Продано: +${r.price} ⭐</h2><button class="b" style="width:200px" onclick="$('#roll').style.display='none'">Ок</button>`}catch(e){}}
async function inv(){const it=await api('/items');
 $('#p-inv').innerHTML=`<h3 style="margin:0 0 10px">🎒 Інвентар (${it.length})</h3>`+(it.length?`<div class="grid">${it.map(i=>`<div class="card k-${i.rarity}" style="text-align:center">${img(slug(i.name),'cv')}<b class="${i.rarity}">${esc(i.name)}</b><div class="mut" style="margin:4px 0 8px">${i.rarity}</div><button class="b" onclick="sellInv(${i.id})">Продати · ${i.price} ⭐</button></div>`).join('')}</div>`:'<div class="card mut">Інвентар порожній. Відкрийте кейс!</div>')}
async function sellInv(id){try{const r=await api('/item/sell',{body:{id}});setBal(r.balance);inv()}catch(e){}}
async function topup(){try{setBal((await api('/topup',{body:{}})).balance)}catch(e){}}
async function hist(k){
 $('#chips').innerHTML=[['all','Усі'],['game','Ігри'],['case','Кейси'],['reward','Нагороди']].map(c=>`<button class="${c[0]===k?'on':''}" onclick="hist('${c[0]}')">${c[1]}</button>`).join('');
 const r=await api('/history?kind='+k);$('#hist').innerHTML=r.map(h=>`<div class="row"><div>${esc(h.title)}${h.item?`<br><span class="mut">🎁 ${esc(h.item)}</span>`:''}<br><span class="mut">${new Date(h.ts).toLocaleString('uk')}</span></div><b class="${h.delta>=0?'pos':'neg'}">${h.delta>0?'+':''}${h.delta} ⭐</b></div>`).join('')||'<div class="mut">Порожньо</div>'}
async function profile(){ME=await api('/me');const it=await api('/items');
 $('#p-profile').innerHTML=`<div class="card" style="text-align:center"><img class="av" style="width:80px;height:80px" src="${esc(ME.photo)}" onerror="this.style.visibility='hidden'"><h3>${esc(ME.name)}</h3><div class="mut">@${esc(ME.username)} · ID ${ME.id}</div><p>⭐ ${ME.balance} · 📦 ${ME.cases} кейсів · 🎮 ${ME.games} ігор · 🎁 ${it.length} предметів</p></div>
 <button class="b" onclick="topup()" style="margin-bottom:8px">Поповнити баланс</button><button class="b" onclick="go('inv')" style="margin-bottom:8px">🎒 Інвентар</button><button class="b" onclick="go('history')" style="margin-bottom:8px">Історія активності</button><button class="b" onclick="tg?tg.openTelegramLink('https://t.me/'):0">Підтримка</button>`}
async function withdraw(){const it=await api('/items');$('#p-profile').classList.add('on');
 $('#p-profile').innerHTML=`<button class="b" onclick="go('profile')" style="margin-bottom:10px">← Профіль</button><div class="mut">Демо-колекція. Обмін/виведення — лише інтерфейс-прототип, реальних операцій немає.</div>`+(it.map(i=>`<div class="card" style="display:flex;gap:10px;align-items:center">${img(slug(i.name))}<div><b class="${i.rarity}">${esc(i.name)}</b><div class="mut">Рідкість: ${i.rarity} · Статус: у колекції · Вартість: немає</div></div></div>`).join('')||'<div class="card mut">Колекція порожня</div>')}
function game(g){go('games');({miner,crash,duck,spin})[g]()}
const G=h=>$('#game').innerHTML=`<div class="card">${h}</div>`;
async function miner(){G(`<h3>⛏️ Miner</h3><div id="mlog" style="height:200px;overflow:auto"></div><button class="b" id="mb">Скинути кирку · 10 ⭐</button>`);
 $('#mb').onclick=async()=>{$('#mb').disabled=true;$('#mlog').innerHTML='';try{const r=await api('/miner',{body:{}});
 for(const s of r.steps){$('#mlog').insertAdjacentHTML('afterbegin',`<div class="row pop"><span>${s.broken?'💥 Кирка зламалась об':'⛏️ Зламано'}: ${s.block} (міцн. ${s.hp})</span><b class="pos">${s.reward?'+'+s.reward:''}</b></div>`);await new Promise(r=>setTimeout(r,350))}
 $('#mlog').insertAdjacentHTML('afterbegin',`<div class="row"><b>Підсумок: ${r.total} ⭐</b></div>`);setBal(r.balance)}catch(e){}$('#mb').disabled=false}}
async function crash(){G(`<h3>🚀 Crash (демо)</h3><div class="big" id="mult">1.00x</div><div class="chest" id="rk">🚀</div><button class="b" id="cb">Старт · 10 ⭐</button>`);
 let timer;const stop=()=>clearInterval(timer);
 $('#cb').onclick=async()=>{const b=$('#cb');
  if(b.dataset.run){stop();b.dataset.run='';const r=await api('/crash/cashout',{body:{}});setBal(r.balance);end(r);return}
  try{const s=await api('/crash/start',{body:{}});setBal(s.balance);b.dataset.run=1;b.textContent='Забрати!';const t0=Date.now();$('#rk').textContent='🚀';
  timer=setInterval(async()=>{$('#mult').textContent=Math.exp(s.k*(Date.now()-t0)/1000).toFixed(2)+'x';const st=await api('/crash/state');if(st.crashed){stop();b.dataset.run='';end(st)}},150)}catch(e){}}
 function end(r){$('#cb').textContent='Ще раз · 10 ⭐';if(r.crashed){$('#rk').textContent='💥';$('#mult').textContent='Вибух '+r.at.toFixed(2)+'x'}else{$('#mult').textContent='+'+r.win+' ⭐ (x'+r.m.toFixed(2)+')'}}}
async function duck(){G(`<h3>🦆 Duck Hunt</h3><div class="mut">Час: <b id="t">15</b>с · Влучань: <b id="h">0</b> · Комбо: <b id="cm">0</b></div><div id="arena"></div><button class="b" id="db" style="margin-top:8px">Старт</button>`);
 $('#db').onclick=async()=>{$('#db').disabled=true;await api('/duck/start',{body:{}});let hits=0,combo=0,best=0,left=15;const ar=$('#arena');ar.innerHTML='';
  const spawn=()=>{const d=document.createElement('div');d.className='duck';d.textContent='🦆';let x=-30,y=20+Math.random()*230,v=1.5+Math.random()*2.5;d.style.top=y+'px';
  d.onpointerdown=e=>{e.preventDefault();hits++;combo++;best=Math.max(best,combo);d.textContent='💥';d.onpointerdown=null;setTimeout(()=>d.remove(),200);$('#h').textContent=hits;$('#cm').textContent=combo;clearInterval(m)};
  const m=setInterval(()=>{x+=v;d.style.left=x+'px';if(x>ar.clientWidth){combo=0;$('#cm').textContent=0;d.remove();clearInterval(m)}},16);ar.append(d)};
  const sp=setInterval(spawn,600);const tm=setInterval(async()=>{$('#t').textContent=--left;if(left<=0){clearInterval(tm);clearInterval(sp);
  await new Promise(r=>setTimeout(r,1200));try{const r=await api('/duck/finish',{body:{hits,combo:best}});setBal(r.balance);ar.innerHTML=`<div class="big" style="padding-top:100px">+${r.win} ⭐</div>`}catch(e){}$('#db').disabled=false}},1000)}}
async function spin(){G(`<h3>🎡 Lucky Spin</h3><div class="ptr">▼</div><div class="wheel" id="wh"></div><button class="b" id="sb">Крутити · 10 ⭐</button><div id="sh" class="mut" style="margin-top:8px"></div>`);
 const cols=['#087CFF','#0a2a50'];let rot=0;
 const draw=s=>{$('#wh').style.background='conic-gradient('+s.map((v,i)=>`${cols[i%2]} ${i*360/s.length}deg ${(i+1)*360/s.length}deg`).join(',')+')';$('#wh').innerHTML=s.map((v,i)=>`<div style="position:absolute;left:50%;top:50%;transform:rotate(${(i+.5)*360/s.length}deg) translate(-50%,-92px);transform-origin:0 0;font-weight:700;width:30px;text-align:center">${v}</div>`).join('')};
 draw([0,5,0,10,0,20,0,50,0,100]);
 const h=async()=>{const r=await api('/spins');$('#sh').innerHTML='Історія: '+(r.map(x=>x.delta+10).join(', ')||'—')};h();
 $('#sb').onclick=async()=>{$('#sb').disabled=true;try{const r=await api('/spin',{body:{}});const n=r.sectors.length;rot+=360*5+(360-(r.idx+.5)*360/n)-(rot%360);$('#wh').style.transform=`rotate(${rot}deg)`;
 setTimeout(()=>{setBal(r.balance);toast(r.win?`+${r.win} ⭐`:'Без виграшу');h();$('#sb').disabled=false},4100)}catch(e){$('#sb').disabled=false}}}
