<!doctype html>
<html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Froggy Slot</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#03130a;--g:#39ff14;--g2:#8dff4a;--gd:#052612;--card:#0a2f18;--mut:#86b794;--gold:#ffc62b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;color:#fff;font-family:'Nunito',system-ui,sans-serif;font-weight:700;padding-bottom:84px;min-height:100vh;background:radial-gradient(120% 70% at 50% -8%,#0f6a2c 0%,#05190d 55%,#020b06 100%) fixed}
.s{width:1em;height:1em;vertical-align:-.14em}
.top{display:flex;align-items:center;gap:10px;padding:10px 14px;position:sticky;top:0;background:#03130af0;backdrop-filter:blur(10px);z-index:5;border-bottom:1px solid #39ff1425}
.av{width:38px;height:38px;border-radius:50%;border:2px solid var(--g);box-shadow:0 0 12px #39ff1488;object-fit:cover;background:var(--card)}
.brand{font-weight:900;font-size:18px;line-height:1;color:var(--g);text-shadow:0 0 12px #39ff1488;letter-spacing:.5px}.brand span{color:#fff}
.mut{color:var(--mut);font-size:12px;font-weight:700}
.pill{display:flex;align-items:center;gap:6px;background:#0a2f18;border:1px solid #39ff1466;border-radius:20px;padding:6px 12px;box-shadow:0 0 14px #39ff1430;font-weight:900}
.pill svg{width:18px;height:18px}
main{padding:14px;max-width:560px;margin:auto}.page{display:none;animation:in .3s}.page.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.card{background:linear-gradient(160deg,#0d3b20,#072514);border:1px solid #39ff1440;border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:0 8px 22px #0008,inset 0 0 24px #39ff1410;transition:transform .12s;position:relative}
.card:active{transform:scale(.97)}
h3{margin:0 0 8px;font-weight:900}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button.b{width:100%;background:linear-gradient(180deg,#8dff4a,#2fd44f);color:#052612;font:900 15px 'Nunito',system-ui;border:0;padding:11px 14px;border-radius:14px;box-shadow:0 0 16px #39ff1455,0 3px 0 #17802c;transition:transform .1s,box-shadow .1s}
button.b:active{transform:translateY(2px) scale(.97);box-shadow:0 0 8px #39ff1455,0 1px 0 #17802c}button.b:disabled{opacity:.5}
button.b.alt{background:linear-gradient(180deg,#134a28,#0a2f18);color:#fff;border:1px solid #39ff1466;box-shadow:0 0 12px #39ff1425}
.hero{position:relative;aspect-ratio:1/1;border-radius:26px;overflow:hidden;border:1px solid #39ff1466;box-shadow:0 0 34px #39ff1440,0 12px 30px #000a;margin-bottom:12px;background:#04170c}
.hero img{position:absolute;display:block;user-select:none;-webkit-user-drag:none;pointer-events:none}
.hero .l0,.hero .l3{inset:0;width:100%;height:100%}.hero .sp{will-change:transform}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px;text-align:center}
.tile svg,.gi{width:40px;height:40px;stroke:var(--g);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 6px #39ff14aa)}
.scroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;margin:0 -14px 12px;padding:0 14px 6px}.scroll .card{flex:none;width:150px;margin:0;text-align:center}
.lbl{font-weight:900;font-size:16px;margin:4px 2px 8px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#03130af7;border-top:1px solid #39ff1440;padding-bottom:env(safe-area-inset-bottom);backdrop-filter:blur(10px);z-index:6}
nav div{flex:1;text-align:center;padding:9px 0 8px;font-size:11px;color:var(--mut);transition:color .2s}
nav svg{display:block;margin:0 auto 3px;width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav .on{color:var(--g);text-shadow:0 0 10px var(--g)}nav .on svg{filter:drop-shadow(0 0 6px var(--g))}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #ffffff12;font-size:13px}
.pos{color:#6dff7a}.neg{color:#ff7a7a}
.chips{display:flex;gap:6px;margin-bottom:10px;overflow:auto}.chips button{background:#0a2f18;color:#fff;border:1px solid #39ff1455;border-radius:14px;padding:7px 14px;font:800 13px 'Nunito',system-ui}.chips .on{background:var(--g);color:#052612}
#modal{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:20}#modal .card{width:86%;max-height:82vh;overflow:auto}
#roll{position:fixed;inset:0;background:#02100afa;z-index:30;display:none;flex-direction:column;justify-content:center}
.rs{overflow:hidden;position:relative;height:250px;width:100%;background:#031109;border-block:1px solid #39ff1466}
.rl{position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1px;background:var(--g);box-shadow:0 0 16px var(--g);z-index:2}
.rt{display:flex;height:100%;will-change:transform}
.tl{flex:none;width:170px;margin:12px 10px 12px 0;transition:transform .18s,border-color .18s,box-shadow .18s;border-radius:14px;background:#0a2f18;border:1px solid #39ff1450;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;text-align:center;padding:4px;gap:2px}
.tl.rare{border-color:#4aa8ff}.tl.epic{border-color:#c084fc}.tl.legendary{border-color:var(--gold)}.tl.mythic{border-color:#ff7be5}
.pi{width:62px;height:62px;object-fit:contain}.cv{width:104px;height:104px;display:block;margin:6px auto;object-fit:contain;animation:fl 3s infinite ease-in-out}
.cc{width:100%;max-width:190px;display:block;margin:0 auto 8px;mix-blend-mode:screen;border-radius:14px}
@keyframes fl{50%{transform:translateY(-6px)}}
.pop{animation:pop .6s}@keyframes pop{0%{transform:scale(.2) rotate(-20deg)}70%{transform:scale(1.15)}}
.ib{position:absolute;right:10px;top:8px;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--mut);color:var(--mut);font:900 12px/19px 'Nunito';text-align:center;z-index:2}
.common{color:#9fb8a8}.rare{color:#6db6ff}.epic{color:#c99bff}.legendary{color:var(--gold)}.mythic{color:#ff7be5}
.k-common{background:linear-gradient(160deg,#124a28,#072514)}.k-rare{background:linear-gradient(160deg,#0f4f73,#072514);border-color:#4aa8ff88}.k-epic{background:linear-gradient(160deg,#4a2a7a,#072514);border-color:#c084fc88}.k-legendary{background:linear-gradient(160deg,#7a5a10,#072514);border-color:#ffc62b99}.k-mythic{background:linear-gradient(160deg,#7a1f78,#072514);border-color:#ff7be5aa;box-shadow:0 0 22px #ff7be533}
.big{font-size:44px;font-weight:900;text-align:center;color:var(--g);text-shadow:0 0 18px var(--g)}
#arena{position:relative;height:300px;background:#031109;border-radius:16px;overflow:hidden;border:1px solid #39ff1466;touch-action:manipulation}
.duck{position:absolute;width:54px;user-select:none}.duck svg{width:100%;display:block}
.puff{position:absolute;width:50px;height:50px;border-radius:50%;background:radial-gradient(#fff,#8dff4a 40%,transparent 70%);animation:boom .35s forwards}
@keyframes boom{from{transform:scale(.3);opacity:1}to{transform:scale(2.2);opacity:0}}
#cr{position:relative;height:170px;background:#031109;border-radius:16px;border:1px solid #39ff1466;overflow:hidden;margin:8px 0}
#rk{position:absolute;left:50%;bottom:8px;width:38px;margin-left:-19px;transition:transform .15s linear}
#rk .fl{animation:fk .2s infinite alternate}@keyframes fk{to{transform:scaleY(1.5)}}
#bm{position:absolute;left:50%;bottom:20px;width:90px;height:90px;margin-left:-45px;border-radius:50%;background:radial-gradient(#fff,#ffc62b 35%,#ff5a1f 60%,transparent 72%);display:none}
#bm.on{display:block;animation:boom .7s forwards}
.wheel{width:230px;height:230px;border-radius:50%;margin:6px auto 0;border:4px solid var(--g);box-shadow:0 0 24px #39ff1488;transition:transform 4s cubic-bezier(.1,.7,.1,1);position:relative}
.ptr{width:0;height:0;margin:8px auto -12px;border:12px solid transparent;border-top:20px solid var(--gold);position:relative;z-index:2;filter:drop-shadow(0 0 6px var(--gold))}
.stat{text-align:center}.stat b{display:block;font-size:22px;color:var(--g)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--g);box-shadow:0 0 8px var(--g);margin-right:8px}.dot.x{background:#ff5a5a;box-shadow:0 0 8px #ff5a5a}
.tag{font-size:10px;background:#1d6b33;border-radius:6px;padding:1px 6px;margin-left:4px;font-weight:800}
.bet input{width:100%;background:#031109;border:1px solid #39ff1466;border-radius:12px;color:#fff;font:900 18px 'Nunito',system-ui;padding:10px 12px;margin-bottom:6px}
.bq{display:flex;gap:6px;margin-bottom:10px}.bq button{flex:1;background:#0a2f18;color:#fff;border:1px solid #39ff1455;border-radius:10px;padding:8px 0;font:800 12px 'Nunito',system-ui}
#scene{position:relative;height:290px;border-radius:18px;overflow:hidden;border:1px solid #8b5cf680;background:radial-gradient(120% 90% at 50% 110%,#2a1260,#140a33 55%,#0a0620);box-shadow:0 0 26px #7c3aed55}
.stars{position:absolute;inset:0;background-image:radial-gradient(1.5px 1.5px at 20px 30px,#fffc,transparent),radial-gradient(1px 1px at 90px 80px,#fff9,transparent),radial-gradient(1.5px 1.5px at 160px 20px,#fffc,transparent),radial-gradient(1px 1px at 240px 110px,#fff9,transparent),radial-gradient(1.5px 1.5px at 310px 50px,#fffc,transparent);background-size:340px 150px;animation:sd 5s linear infinite}
@keyframes sd{to{background-position:-340px 150px}}
.ttl{position:absolute;left:14px;top:10px;line-height:.92;font-weight:900;font-style:italic;transform:skew(-6deg);z-index:2}
.ttl .p{display:block;font-size:34px;color:#9b6bff;text-shadow:0 0 16px #8b5cf6cc;-webkit-text-stroke:1px #3b1d8a}.ttl .w{display:block;font-size:34px;color:#fff;text-shadow:0 2px 0 #2a1260}
#mlt{position:absolute;left:0;right:0;top:38%;text-align:center;font-size:52px;font-weight:900;z-index:4;text-shadow:0 0 22px #8b5cf6,0 3px 0 #1a0c42}#mlt.win{color:#6dff7a}#mlt.lose{color:#ff7a7a;font-size:36px}
#pilot{position:absolute;left:0;bottom:0;width:104px;z-index:3;will-change:transform}#pilot img.fr{width:100%;display:block;transform:rotate(-12deg)}
.flame{animation:fk .11s infinite alternate;transform-origin:100% 50%}@keyframes fk{to{transform:rotate(-28deg) scale(1.22,.82)}}
.clouds{position:absolute;left:0;right:0;bottom:0;width:100%;height:54px;z-index:2}
.lastrow{display:flex;gap:6px;overflow-x:auto;margin:10px 0}.lc{flex:none;font-weight:900;font-size:12px;padding:4px 9px;border-radius:10px;background:#0a2f18;border:1px solid #39ff1440}.lc.g{color:var(--gold);border-color:#ffc62b88}.lc.m{color:#6dff7a}.lc.r{color:#ff7a7a}
.tl .pi{width:116px;height:116px}.tl{font-size:13px;font-weight:800}.tl.act{transform:scale(1.07);border-color:var(--g);box-shadow:0 0 22px #39ff1488}
#roll .glow{position:absolute;inset:0;background:radial-gradient(60% 40% at 50% 50%,#39ff1426,transparent 70%);pointer-events:none}
.rv{width:170px;height:170px;object-fit:contain;display:block;margin:0 auto;filter:drop-shadow(0 0 26px #39ff14);animation:rvp .9s cubic-bezier(.2,1.4,.4,1)}@keyframes rvp{from{transform:scale(.2);opacity:0}}
#mine{position:relative;height:330px;overflow:hidden;border-radius:16px;border:1px solid #39ff1466;background:#1b120a}
#cam{position:absolute;left:0;right:0;top:0;transition:transform .4s ease-out}#shaft{position:relative;margin:0 auto}
.mrow{display:flex}.blk{flex:none;position:relative;image-rendering:pixelated;background-size:100% 100%;transition:transform .22s,opacity .22s}
.cr{position:absolute;inset:0;background-size:100% 100%;image-rendering:pixelated}
#pk{position:absolute;left:50%;top:0;z-index:5;transition:transform .3s cubic-bezier(.5,0,1,1);will-change:transform}#pk img{width:100%;image-rendering:pixelated;display:block;transform-origin:20% 85%;transition:transform .07s}
#pk.hit img{transform:rotate(-48deg)}#pk.brk img{animation:brk .5s forwards}@keyframes brk{30%{transform:rotate(20deg) scale(1.1)}to{transform:translateY(40px) rotate(120deg) scale(.6);opacity:0}}
.ptc{position:absolute;width:8px;height:8px;image-rendering:pixelated;z-index:4;transition:transform .55s cubic-bezier(.2,.8,.4,1),opacity .55s}
.fup{position:absolute;z-index:6;font-weight:900;color:var(--gold);text-shadow:0 2px 0 #000;animation:fup .9s forwards;white-space:nowrap}@keyframes fup{to{transform:translateY(-34px);opacity:0}}
.dur{height:8px;background:#0a2f18;border-radius:6px;overflow:hidden;margin:0 0 8px;border:1px solid #39ff1440}.dur i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#39ff14,#8dff4a);transition:width .3s}
.dial{position:relative;width:210px;margin:0 auto 10px}.dial svg{width:100%;display:block}.dc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}.dc b{font-size:30px;color:var(--g);text-shadow:0 0 14px var(--g)}
.ugrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px;max-height:240px;overflow:auto}.ui{border:1px solid #39ff1440;border-radius:14px;padding:6px 4px;text-align:center;background:#072314;font-size:11px;transition:transform .1s}.ui img{width:52px;height:52px;object-fit:contain}.ui.on{border-color:var(--g);box-shadow:0 0 14px #39ff1488;background:#0d3b20}.ui:active{transform:scale(.95)}
#feed{display:flex;gap:8px;overflow:hidden;margin-top:8px}.fd{flex:none;width:68px;text-align:center;border:1px solid #39ff1440;border-radius:12px;padding:6px 2px;background:#072314;font-size:10px;animation:fdin .5s}.fd img{width:42px;height:42px;object-fit:contain;display:block;margin:0 auto 2px}
.fd.rare{border-color:#4aa8ff}.fd.epic{border-color:#c084fc}.fd.legendary{border-color:var(--gold)}.fd.mythic{border-color:#ff7be5}@keyframes fdin{from{width:0;opacity:0;padding:0;border-width:0}}
</style></head><body>
<div class="top"><img id="av" class="av" src="" alt=""><div><div class="brand">FROGGY <span>SLOT</span></div><div class="mut" id="un"></div></div>
<div style="margin-left:auto" class="pill" id="balp"><span id="ic-st"></span><b id="bal">0</b></div><div class="pill" onclick="go('inv')" id="ic-bag"></div></div>
<main>
<section class="page on" id="p-home">
 <div class="hero" id="hero"><img class="l0" src="/img/logo/bg.webp" alt="Froggy Slot"></div>
 <div class="row2"><button class="b" onclick="topup()">Поповнити баланс</button><button class="b alt" onclick="go('inv')">Інвентар</button></div>
 <div class="lbl">Ігри</div>
 <div class="grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:12px" id="quick"></div>
 <div class="lbl">Популярні кейси</div><div class="scroll" id="pop"></div>
 <div class="grid"><div class="card stat"><span class="mut">Онлайн</span><b id="online">0</b></div><div class="card stat" onclick="go('cases')"><span class="mut">Усі кейси</span><b>6</b></div></div>
 <div class="card"><b>Останні випадіння</b><div id="feed"></div><div class="mut" style="margin-top:8px;font-size:11px">Онлайн і стрічка випадінь — демонстраційні дані.</div></div>
</section>
<section class="page" id="p-games"><div class="grid" id="gt"></div><div id="game" style="margin-top:12px"></div></section>
<section class="page" id="p-cases"><div class="mut" style="margin-bottom:8px">Віртуальні колекційні предмети · не є блокчейн-NFT і не є подарунками Telegram</div><div class="grid" id="cases"></div></section>
<section class="page" id="p-history"><div class="chips" id="chips"></div><div id="hist"></div></section>
<section class="page" id="p-inv"></section>
<section class="page" id="p-admin"></section>
<section class="page" id="p-profile"></section>
</main>
<nav id="nav"></nav>
<div id="roll"></div>
<div id="modal" onclick="this.style.display='none'"><div class="card" id="mbody" onclick="event.stopPropagation()"></div></div>
<script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();try{tg?.setHeaderColor('#03130a');tg?.setBackgroundColor('#03130a')}catch(e){}
const $=s=>document.querySelector(s);let ME;
const ST='<svg class="s" viewBox="0 0 24 24"><path fill="#ffc62b" stroke="#a87400" stroke-width="1" d="M12 2l3 6.5 7 .9-5.1 4.9 1.3 7L12 17.8 5.8 21.3l1.3-7L2 9.4l7-.9z"/></svg>';
const SV=p=>`<svg viewBox="0 0 24 24">${p}</svg>`;
const IC={home:SV('<path d="M3 11l9-8 9 8v10h-6v-6H9v6H3z"/>'),games:SV('<rect x="2" y="7" width="20" height="11" rx="5"/><path d="M7 10v5M4.5 12.5h5"/><circle cx="16" cy="11.5" r="1"/><circle cx="18.5" cy="14" r="1"/>'),cases:SV('<path d="M3 8l9-5 9 5v9l-9 5-9-5z"/><path d="M3 8l9 5 9-5M12 13v9"/>'),history:SV('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'),profile:SV('<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>'),
bag:SV('<path d="M6 8h12l1 13H5z"/><path d="M9 8V6a3 3 0 016 0v2"/>'),miner:SV('<path d="M5 20L14 11"/><path d="M8 5c6-2 12 2 12 9M8 5c1 5 5 9 12 9"/>'),crash:SV('<path d="M3 20l7-8 4 4 7-10"/><path d="M15 6h6v6"/>'),duck:SV('<circle cx="9" cy="8" r="4"/><path d="M13 8h6l-4 2"/><path d="M5 12c-2 6 4 9 9 8 4-1 5-5 3-8"/>'),spin:SV('<circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6L5.6 18.4"/>')};
IC.upgrade=SV('<circle cx="12" cy="12" r="9"/><path d="M12 17V8M8 12l4-4 4 4"/>');$('#ic-st').innerHTML=ST;$('#ic-bag').innerHTML=IC.bag.replace('<svg','<svg style="width:20px;height:20px;stroke:#39ff14;fill:none;stroke-width:1.9;stroke-linecap:round"');
const api=async(p,o={})=>{const r=await fetch('/api'+p,{method:o.body?'POST':(o.m||'GET'),headers:{'Content-Type':'application/json','X-Init-Data':tg?.initData||''},body:o.body?JSON.stringify(o.body):(o.m==='POST'?'{}':undefined)});const j=await r.json();if(!r.ok){toast(j.error);throw j}return j};
const toast=t=>tg?.showAlert?tg.showAlert(t):alert(t);
const setBal=b=>{$('#bal').textContent=b;ME.balance=b};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TABS=[['home','Головна'],['games','Ігри'],['cases','Кейси'],['history','Історія'],['profile','Профіль']];
$('#nav').innerHTML=TABS.map(t=>`<div id="n-${t[0]}" onclick="go('${t[0]}')">${IC[t[0]]}${t[1]}</div>`).join('');
function go(p){document.querySelectorAll('.page').forEach(e=>e.classList.remove('on'));$('#p-'+p).classList.add('on');
 document.querySelectorAll('nav div').forEach(e=>e.classList.remove('on'));$('#n-'+p)?.classList.add('on');
 if(p==='history')hist('all');if(p==='profile')profile();if(p==='inv')inv();if(p==='admin')admin();scrollTo(0,0)}
const GAMES=[['miner','Miner','своя ставка'],['crash','Crash','своя ставка'],['spin','Lucky Spin','своя ставка'],['upgrade','Upgrader','NFT → ціль']];
$('#quick').innerHTML=GAMES.map(g=>`<div class="card tile" style="margin:0" onclick="game('${g[0]}')">${IC[g[0]]}<span style="font-size:11px">${g[1]}</span></div>`).join('');
$('#gt').innerHTML=GAMES.map(g=>`<div class="card tile" onclick="game('${g[0]}')">${IC[g[0]]}<b>${g[1]}</b><span class="mut">${g[2]}</span></div>`).join('');
/* ---- Лого-анімація ---- */
const HM={b1:[6.539,2.871,24.96,16.507],b2:[63.876,15.391,19.617,13.238],b3:[87.002,12.36,10.447,16.667],b4:[1.595,43.541,16.746,14.115],b6:[4.147,84.769,25.359,13.876],b7:[74.801,83.652,23.844,16.188],heart:[42.265,37.002,24.083,21.85]};
(function(){const hero=$('#hero');
 for(const k of Object.keys(HM)){const i=document.createElement('img');i.className='sp';i.dataset.k=k;i.src=`/img/logo/${k}.webp`;const m=HM[k];i.style.cssText=`left:${m[0]}%;top:${m[1]}%;width:${m[2]}%;height:${m[3]}%`;if(k==='heart')i.style.transformOrigin='50% 55%';hero.append(i)}
 const t=document.createElement('img');t.className='l3';t.src='/img/logo/top.webp';t.alt='';hero.append(t);
 if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;

async function crash(){G(`<div id="scene"><div class="stars"></div><div class="ttl"><span class="p">FROGGY</span><span class="w">SLOT</span></div><div id="mlt">1.00x</div><div id="pilot">${JETPACK}${FLAME}<img class="fr" src="${PILOT}" alt=""></div>${CLOUDS}</div><div class="lastrow" id="last"></div>${betUI(10)}<button class="b" id="cb">Зробити ставку</button>`);
 const sc=$('#scene'),pl=$('#pilot'),mt=$('#mlt');let raf=0,poll=0,t0=0,K=.1,bet=0,run=false;
 const loadLast=async()=>{try{const l=await api('/crash/last');$('#last').innerHTML=l.map(c=>`<span class="lc ${c>=10?'g':c>=2?'m':'r'}">${c.toFixed(2)}x</span>`).join('')}catch(e){}};loadLast();
 const place=m=>{const W=sc.clientWidth,H=sc.clientHeight,p=Math.min(1,Math.log(Math.max(m,1))/Math.log(30));pl.style.transform=`translate(${8+p*(W-130)}px,${-(10+Math.pow(p,.8)*(H-170))}px)`};
 place(1);
 const away=()=>{pl.style.transition='transform .9s cubic-bezier(.5,0,1,.6)';pl.style.transform=`translate(${sc.clientWidth+160}px,${-(sc.clientHeight+160)}px)`;setTimeout(()=>{pl.style.transition='none';place(1);mt.className='';mt.textContent='1.00x';pl.getBoundingClientRect()},1700)};
 const finish=()=>{run=false;cancelAnimationFrame(raf);clearInterval(poll);$('#cb').textContent='Зробити ставку';$('#cb').classList.remove('alt');loadLast()};
 const frame=()=>{if(!run)return;const m=Math.exp(K*(Date.now()-t0)/1000);mt.textContent=m.toFixed(2)+'x';place(m);$('#cb').textContent=`Забрати ${Math.floor(bet*m)}`;raf=requestAnimationFrame(frame)};
 $('#cb').onclick=async()=>{const b=$('#cb');
  if(run){const m=Math.exp(K*(Date.now()-t0)/1000);try{const r=await api('/crash/cashout',{body:{}});setBal(r.balance);finish();
   if(r.crashed){mt.className='lose';mt.textContent='Улетів '+r.at.toFixed(2)+'x';away()}else{mt.className='win';mt.innerHTML=`+${r.win} ${ST}`;setTimeout(away,900)}}catch(e){}return}
  bet=getBet();if(!bet)return;
  try{const s=await api('/crash/start',{body:{bet}});setBal(s.balance);K=s.k;t0=Date.now();run=true;mt.className='';b.classList.add('alt');frame();
   poll=setInterval(async()=>{try{const st=await api('/crash/state');if(st.crashed&&run){finish();mt.className='lose';mt.textContent='Улетів '+st.at.toFixed(2)+'x';away()}}catch(e){}},250)}catch(e){}}}
async function spin(){G(`<h3>Lucky Spin</h3><div class="ptr"></div><div class="wheel" id="wh"></div>${betUI(10)}<button class="b" id="sb">Крутити</button><div id="sh" class="mut" style="margin-top:8px;text-align:center"></div>`);
 const cols=['#1a8f3a','#0a3d1c'];let rot=0;
 const draw=s=>{$('#wh').style.background='conic-gradient('+s.map((v,i)=>`${cols[i%2]} ${i*360/s.length}deg ${(i+1)*360/s.length}deg`).join(',')+')';$('#wh').innerHTML=s.map((v,i)=>`<div style="position:absolute;left:50%;top:50%;transform:rotate(${(i+.5)*360/s.length}deg) translate(-50%,-96px);transform-origin:0 0;font-weight:900;width:34px;text-align:center;font-size:13px">${v?'x'+v:'0'}</div>`).join('')};
 draw([0,.5,0,1,0,2,0,5,0,10]);
 const h=async()=>{const r=await api('/spins');$('#sh').textContent='Історія: '+(r.map(x=>x.title.replace('Lucky Spin ','')).join(' · ')||'—')};h();
 $('#sb').onclick=async()=>{const bet=getBet();if(!bet)return;$('#sb').disabled=true;try{const r=await api('/spin',{body:{bet}});const n=r.sectors.length;setBal(r.balance-r.win);rot+=360*5+(360-(r.idx+.5)*360/n)-(rot%360);$('#wh').style.transform=`rotate(${rot}deg)`;
 setTimeout(()=>{setBal(r.balance);$('#sh').innerHTML=r.win?`<b class="pos">Виграш +${r.win} ${ST} (x${r.mult})</b>`:'Без виграшу';h();$('#sb').disabled=false},4100)}catch(e){$('#sb').disabled=false}}}
async function upgrade(){const inv=await api('/items');let sel=new Set(),T=null;const C=2*Math.PI*80;
 G(`<h3>Upgrader</h3><div class="dial"><svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="80" fill="none" stroke="#3a1a1a" stroke-width="16"/><circle id="uarc" cx="100" cy="100" r="80" fill="none" stroke="#39ff14" stroke-width="16" stroke-dasharray="0 ${C}" transform="rotate(-90 100 100)" style="filter:drop-shadow(0 0 6px #39ff14)"/><g id="uptr" style="transform-origin:100px 100px"><path d="M100 6l7 22H93z" fill="#ffc62b"/></g></svg><div class="dc"><b id="uch">0%</b><span class="mut" id="ux"></span></div></div>
 <div class="lbl">Ваші предмети <span class="mut" id="ust"></span></div><div class="ugrid" id="ui">${inv.length?inv.map(i=>`<div class="ui" data-id="${i.id}" data-p="${i.price}">${img(slug(i.name),'')}<div>${esc(i.name)}</div><b>${i.price}</b></div>`).join(''):'<div class="mut" style="grid-column:span 3">Інвентар порожній. Відкрийте кейс.</div>'}</div>
 <div class="lbl">Ціль</div><div class="chips" id="upre">${[20,25,50,75].map(p=>`<button data-p="${p}">${p}%</button>`).join('')}</div>
 <input id="uam" type="number" inputmode="numeric" min="1" placeholder="Своя сума зірок" style="width:100%;background:#031109;border:1px solid #39ff1466;border-radius:12px;color:#fff;font:900 16px 'Nunito';padding:10px 12px;margin-bottom:8px">
 <button class="b alt" id="upick" style="margin-bottom:8px">Обрати NFT як ціль</button><div id="utg" class="mut" style="margin-bottom:8px;min-height:20px"></div><button class="b" id="ugo">Апгрейд</button><div id="ures" style="text-align:center;margin-top:10px"></div>`);
 const stake=()=>[...sel].reduce((a,id)=>a+(+$(`.ui[data-id="${id}"]`).dataset.p),0);
 const chance=(s,t)=>Math.min(95,Math.max(.0001,.9*s/t*100));
 const ref=()=>{const s=stake(),v=T&&T.value>s&&s>0;$('#ust').textContent=s?`· ${s} ${'зір.'}`:'';const ch=v?chance(s,T.value):0;
  $('#uch').textContent=v?(ch<.01?'<0.01':+ch.toFixed(2))+'%':'0%';$('#ux').textContent=v?`x${(T.value/s).toFixed(2)}`:'';$('#uarc').setAttribute('stroke-dasharray',`${ch/100*C} ${C}`);
  $('#utg').innerHTML=T?(T.type==='item'?`Ціль: ${esc(T.name)} (${T.value})`:`Ціль: ${T.value} ${ST}`)+(T.value<=s?' — має бути дорожчою за ставку':''):'Оберіть ціль'};
 $('#ui').onclick=e=>{const d=e.target.closest('.ui');if(!d)return;const id=d.dataset.id;sel.has(id)?sel.delete(id):sel.add(id);d.classList.toggle('on');ref()};
 $('#upre').onclick=e=>{const b=e.target.closest('button');if(!b)return;const s=stake();if(!s){toast('Спочатку оберіть предмети');return}T={type:'stars',value:Math.max(s+1,Math.round(.9*s*100/+b.dataset.p))};$('#uam').value=T.value;ref()};
 $('#uam').oninput=e=>{const v=Math.floor(+e.target.value);T=v>0?{type:'stars',value:v}:null;ref()};
 $('#upick').onclick=async()=>{const s=stake();if(!s){toast('Спочатку оберіть предмети');return}const cat=(await api('/catalog')).filter(c=>c.price>s);
  modal(`<h3>Оберіть NFT-ціль</h3><div class="ugrid" id="cg" style="max-height:60vh">${cat.map(c=>`<div class="ui" data-n="${esc(c.name)}" data-p="${c.price}">${img(slug(c.name),'')}<div>${esc(c.name)}</div><b>${c.price}</b><div class="mut">${(chance(s,c.price)<.01?'<0.01':+chance(s,c.price).toFixed(2))}%</div></div>`).join('')||'<div class="mut">Немає дорожчих предметів</div>'}</div>`);
  $('#cg').onclick=e=>{const d=e.target.closest('.ui');if(!d)return;T={type:'item',name:d.dataset.n,value:+d.dataset.p};$('#uam').value='';$('#modal').style.display='none';ref()}};
 $('#ugo').onclick=async()=>{const s=stake();if(!sel.size||!T||T.value<=s){toast('Оберіть предмети та дорожчу ціль');return}$('#ugo').disabled=true;
  try{const r=await api('/upgrade',{body:{items:[...sel].map(Number),target:T.type==='item'?{type:'item',name:T.name}:{type:'stars',amount:T.value}}});
   const g=$('#uptr');g.style.transition='none';g.style.transform='rotate(0deg)';g.getBoundingClientRect();g.style.transition='transform 4.2s cubic-bezier(.12,.6,.1,1)';g.style.transform=`rotate(${360*5+r.pos*3.6}deg)`;
   setTimeout(()=>{setBal(r.balance);$('#ures').innerHTML=(r.win?`<h2 class="pos">Успіх!</h2><div>${r.item?`Ви отримали: ${esc(r.item)}`:`+${r.target} ${ST}`}</div>`:`<h2 class="neg">Не пощастило</h2><div class="mut">Шанс був ${r.chance<.01?'<0.01':+r.chance.toFixed(2)}%</div>`)+`<button class="b" style="margin-top:10px" id="uagain">Ще раз</button>`;$('#uagain').onclick=upgrade},4400)}catch(e){$('#ugo').disabled=false}};ref()}
async function admin(){const[s,u]=await Promise.all([api('/admin/stats'),api('/admin/users')]);
 $('#p-admin').innerHTML=`<h3>Адмін-панель</h3><div class="grid" style="margin-bottom:12px">${[['Користувачів',s.users],['Активні 24г',s.active24],['Кейсів відкрито',s.cases],['Ігор зіграно',s.games],['Баланс в обігу',s.balance],['Предметів',s.items],['Результат казино',(s.houseNet>=0?'+':'')+s.houseNet]].map(([a,b])=>`<div class="card stat" style="margin:0"><span class="mut">${a}</span><b>${b}</b></div>`).join('')}</div><div class="lbl">Користувачі</div>`+
 u.map(x=>`<div class="card" style="padding:10px;margin-bottom:8px" onclick="aEdit(${x.id})"><b>${esc(x.name)}</b> <span class="mut">@${esc(x.username)} · ${x.id}</span><div class="mut">Баланс ${x.balance} · кейсів ${x.cases} · ігор ${x.games} · предметів ${x.items}</div></div>`).join('')}
function aEdit(id){modal(`<h3>Користувач ${id}</h3><input id="aamt" type="number" placeholder="Сума" style="width:100%;background:#031109;border:1px solid #39ff1466;border-radius:12px;color:#fff;font:900 16px 'Nunito';padding:10px;margin-bottom:8px"><div style="display:flex;gap:8px;margin-bottom:8px"><button class="b" onclick="aDo(${id},'add')">Додати / відняти</button><button class="b alt" onclick="aDo(${id},'set')">Встановити</button></div><button class="b alt" onclick="aReset(${id})">Скинути профіль</button>`)}
async function aDo(id,mode){const amount=Math.floor(+$('#aamt').value);if(!Number.isFinite(amount)){toast('Введіть число');return}try{await api('/admin/balance',{body:{uid:id,amount,mode}});$('#modal').style.display='none';admin()}catch(e){}}
async function aReset(id){if(!confirm('Скинути баланс, предмети та історію цього користувача?'))return;try{await api('/admin/reset',{body:{uid:id}});$('#modal').style.display='none';admin()}catch(e){}}
/* ---- Онлайн і стрічка ---- */
const pick=a=>a[Math.floor(Math.random()*a.length)];
const onlineBase=()=>{const d=new Date(),h=d.getHours()+d.getMinutes()/60;return 29.5+12.5*Math.cos((h-21.5)/24*2*Math.PI)}; // вечір ≈42, глибока ніч ≈17
let onl=Math.round(onlineBase());
function tickOnline(){const tgt=onlineBase()+Math.sin(Date.now()/540000)*2.5,r=Math.random();onl+=r<.45?0:r<.78?(tgt>onl?1:-1):(Math.random()<.5?1:-1);onl=Math.max(16,Math.min(43,onl));$('#online').textContent=onl;setTimeout(tickOnline,2500+Math.random()*6000)}
const fdEv=()=>{const c=pick(CS);let q=Math.random()*100,o=c.outcomes[0];for(const k of c.outcomes){if((q-=k.w)<0){o=k;break}}return o.t==='stars'?{img:'star',txt:`+${o.amount}`,r:''}:{img:slug(o.name),txt:esc(o.name.length>9?o.name.slice(0,8)+'…':o.name),r:o.rarity}};
const fdHtml=e=>`<div class="fd ${e.r}"><img src="/img/${e.img}.png" alt="">${e.txt}</div>`;
function feedInit(){if(!CS.length)return;$('#feed').innerHTML=Array.from({length:8},()=>fdHtml(fdEv())).join('');(function add(){$('#feed').insertAdjacentHTML('afterbegin',fdHtml(fdEv()));while($('#feed').children.length>9)$('#feed').lastChild.remove();setTimeout(add,2500+Math.random()*6000)})()}
(async()=>{try{ME=await api('/me')}catch(e){document.body.innerHTML='<p style="padding:20px">Відкрийте застосунок через Telegram-бота (або запустіть сервер з DEV=1).</p>';return}
 await loadCases();$('#bal').textContent=ME.balance;$('#av').src=ME.photo||'';$('#un').textContent='@'+ME.username;go('home');
 tickOnline();feedInit()})();
</script></body></html>
